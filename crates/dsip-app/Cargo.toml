[package]
name = "dsip-app"
description = "The running DSIP client: one state model and change stream over a dsip-phone, commands, a local control socket and CLI, native audio"
version = "0.6.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dsip-app"
path = "src/main.rs"

[dependencies]
dsip-endpoint.workspace = true
dsip-core.workspace = true
dsip-media.workspace = true
dsip-messaging.workspace = true
dsip-messaging-device.workspace = true
dsip-messenger.workspace = true
dsip-mls.workspace = true
dsip-phone.workspace = true
dsip-transport.workspace = true
dsip-wake.workspace = true
dsip-schema.workspace = true
anvil-audio.workspace = true
anvil-core.workspace = true
audiopus = "0.3.0-rc.0"   # as dsip-media: the Opus frames its legs carry
bytes = "1"
rustls = "0.23"
# servers.rs: a domain's /.well-known/dsip, as dsip-transport fetches /turn
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
dirs = "6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

keyring-core = "1"
# backup.rs: the recovery code (A6b)
argon2 = "0.5"
chacha20poly1305 = "0.10"
data-encoding = "2"
miniz_oxide = "0.9"
# pairing.rs: the handoff's addresses
if-addrs = "0.15"
getrandom = "0.2"
sha2 = "0.10"

# the control pipe for this user alone (user_only.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes"] }
# keys.rs: each platform's store for the identity's keys (A6a)
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"

# the Secret Service over D-Bus, in Rust (no libdbus), on its own executor: the keyring calls block, and may be made
# from within the app's Tokio runtime
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

# The camera and H.264 in hardware for video calls (video.rs): Android (Camera2, MediaCodec) and Windows (Media
# Foundation) for now; elsewhere calls are audio only
[target.'cfg(any(target_os = "android", windows))'.dependencies]
anvil-video.workspace = true

[dev-dependencies]
dsip-testkit.workspace = true

# tests/messages.rs runs mailboxes, which link OpenSSL: on Linux, where CI has it
[target.'cfg(target_os = "linux")'.dev-dependencies]
dsip-mailbox.workspace = true
# tests/wake.rs: a gateway pushing for an iPhone's two APNs topics, and a relay waking through it
dsip-push.workspace = true
dsip-relay.workspace = true
tokio-rustls = "0.26"
